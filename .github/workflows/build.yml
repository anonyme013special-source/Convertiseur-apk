name: HTML vers APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Generer le projet Android
        run: |
          HTML="$(ls *.html | head -n 1)"
          NAME="$(cat nom.txt 2>/dev/null | head -n 1 | tr -d '"<>&|\\' )"
          [ -z "$NAME" ] && NAME="Mon App"
          ID="$(echo "$NAME" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')"
          [ -z "$ID" ] && ID="app"
          mkdir -p proj/app/src/main/java/com/amaid/webapp proj/app/src/main/assets
          cp "$HTML" proj/app/src/main/assets/index.html
          cat > proj/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "WebApp"
          include(":app")
          EOF
          cat > proj/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          printf 'org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=false\n' > proj/gradle.properties
          cat > proj/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.amaid.webapp"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.amaid.__ID__"
                  minSdk = 23
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="__NAME__"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > proj/app/src/main/java/com/amaid/webapp/MainActivity.kt <<'EOF'
          package com.amaid.webapp

          import android.app.Activity
          import android.os.Bundle
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class MainActivity : Activity() {
              private lateinit var web: WebView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this)
                  setContentView(web)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.mediaPlaybackRequiresUserGesture = false
                  web.webViewClient = WebViewClient()
                  web.webChromeClient = WebChromeClient()
                  web.loadUrl("file:///android_asset/index.html")
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }
          }
          EOF
          sed -i "s|__ID__|$ID|" proj/app/build.gradle.kts
          sed -i "s|__NAME__|$NAME|" proj/app/src/main/AndroidManifest.xml
      - name: Icone
        run: |
          PNG="$(ls *.png 2>/dev/null | head -n 1)"
          if [ -n "$PNG" ]; then
            mkdir -p proj/app/src/main/res/drawable-nodpi
            convert "$PNG" -resize 192x192 proj/app/src/main/res/drawable-nodpi/icon.png || cp "$PNG" proj/app/src/main/res/drawable-nodpi/icon.png
            sed -i 's|<application|<application android:icon="@drawable/icon"|' proj/app/src/main/AndroidManifest.xml
          fi
      - run: cd proj && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
